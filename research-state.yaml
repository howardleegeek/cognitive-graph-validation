        key_insights:
          - "Curriculum learning REFUTED on multi-step tasks: fixed curriculum -51.47% worse than baseline"
          - "Adaptive curriculum nearly matches baseline (-4.61%) but does not improve"
          - "Reverse curriculum and curriculum+attention both perform worst (-54.56%, -55.25%)"
