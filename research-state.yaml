  - experiment_id: H1.388
    description: "Investigate discrepancy between H1.386 and H1.387: test CG on real robot data with varying complexity"
    result:
      cognitive_graph_wins: true
      conclusion: PARTIALLY_SUPPORTED
      improvement_percent: 25.49
      key_finding: "CG large wins on complex data (+25.49%) but both CG variants lose on simple data (-11.04% small, -3.60% large). This partially resolves the H1.386/H1.387 discrepancy: complex tasks need larger representations."
