              vs_original_pct: +0.2
            - name: high_dim
              mse: 0.0985
              improvement_pct: +2.4
              vs_original_pct: +4.1
            - name: residual
              mse: 0.0992
              improvement_pct: +1.7
              vs_original_pct: +3.4
            - name: combined
              mse: 0.0983
              improvement_pct: +2.6
              vs_original_pct: +4.3
          scaling_analysis:
            - objects: 2
              mlp_mse: 0.0991
              combined_mse: 0.0981
              improvement_pct: +1.0
            - objects: 3
              mlp_mse: 0.0997
              combined_mse: 0.0992
              improvement_pct: +0.5
            - objects: 5
              mlp_mse: 0.1048
