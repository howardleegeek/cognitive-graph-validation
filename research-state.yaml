current_round: 158
last_action: "H1.387 - Test if optimal representation size scales with task complexity (number of objects)"
next_intended_action: "H1.388 - Investigate discrepancy between H1.386 and H1.387: test CG on real robot data with varying complexity"

experiments:
  total_runs: 158
  trajectory:
  - experiment_id: H1.387
    description: "Test if optimal representation size scales with task complexity (number of objects)"
    result:
      cognitive_graph_wins: false
      conclusion: PARTIALLY_REFUTED
      improvement_percent: -2.87  # Best case (large, 2 objects)
      key_finding: "Large representation (288+736) is consistently optimal across all object counts (2-8), contradicting H1.386. CG underperforms baseline in all conditions (-2.9% to -67.2%). Gap widens with complexity. Small representations fail catastrophically on complex tasks."
      baseline_mse_best: 0.007484  # Large, 2 objects
      cg_mse_best: 0.007699  # Large, 2 objects
      config:
        n_train: 300
        n_val: 75
        n_epochs: 50
        batch_size: 32
        learning_rate: 1e-3
        object_counts: [2, 4, 6, 8]
        rep_sizes: ["small_72+184", "standard_144+368", "large_288+736"]
  - experiment_id: H1.386
    description: "Investigate why CG underperforms: ablate unified representation size and cross-modal attention depth"
    result:
      cognitive_graph_wins: true
      conclusion: SUPPORTED
      improvement_percent: 25.05
      key_finding: "CG with smaller representation (72+184) and single GNN layer achieves +25.05% improvement vs baseline. Smaller representation (72+184) outperforms standard (144+368) by +10.0% and 2x larger (288+736) by +10.3%. Single GNN layer (+25.05%) outperforms deeper variants (2-4 layers: +15.5-19.6%). Fewer attention heads (1 head: +18.55%) outperform more heads (8 heads: +14.49%). Hierarchical achieves +3.54% improvement."
      baseline_mse: 0.017626
      hierarchical_mse: 0.017002
      cg_mse: 0.013211
      config:
        n_train: 400
        n_val: 100
        n_epochs: 60
        batch_size: 32
        learning_rate: 1e-3
  - experiment_id: H1.385
    description: "Test CG on longer sequences (20+ timesteps) to see if decomposition advantage emerges"
    result:
      cognitive_graph_wins: false
      conclusion: REFUTED
      improvement_percent: -6.34
      key_finding: "CG loses on 24-timestep sequences (-6.34% vs baseline). Hierarchical slightly wins (+2.18%). All models show near-zero decomposition quality (silhouette ~-0.004 to 0.000, ARI ~0.004-0.008). CG's relative position worsens from H1.384 (-3.57% to -6.34%)."
      baseline_mse: 0.025980
      hierarchical_mse: 0.025414
      cg_mse: 0.027626
      config:
        n_train: 400
        n_val: 100
        seq_length: 24
        n_epochs: 80
        batch_size: 32
        learning_rate: 3e-4
  - experiment_id: H1.384
    description: "Analyze CG's learned decomposition patterns vs hierarchical subgoals"
    result:
      cognitive_graph_wins: false
      conclusion: REFUTED
      improvement_percent: -10.53

