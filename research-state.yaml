experiments:
  total_rounds: 266
  trajectory:
    - experiment_id: H1.470.1.1.27
      description: "Test ensemble disagreement on complex hierarchical tasks with 4-5 phases"
      result:
        conclusion: "REFUTED"
        task: "complex_hierarchical_multi_step"
        configurations_tested: 2
        architectures_tested: ["baseline", "oracle_noise", "ensemble_disagreement"]
        sequence_lengths_tested: [40, 50]
        n_phases: [4, 5]
        key_metrics:
          baseline_test_loss_4phase: 0.009572
          oracle_test_loss_4phase: 0.009619
          ensemble_test_loss_4phase: 0.009700
          oracle_improvement_4phase: -0.49
          ensemble_improvement_4phase: -1.35
          baseline_test_loss_5phase: 0.009002
          oracle_test_loss_5phase: 0.008992
          ensemble_test_loss_5phase: 0.009145
          oracle_improvement_5phase: 0.11
          ensemble_improvement_5phase: -1.59
        key_insights:
          - "Ensemble disagreement fails on hierarchical tasks regardless of complexity (3-phase: -4.05%, 4-phase: -1.35%, 5-phase: -1.59%)"
          - "Oracle noise also fails on hierarchical tasks (-0.49% to +0.11%), suggesting noise-aware loss is fundamentally wrong for structured tasks"
          - "Hierarchical tasks have deterministic phase transitions, not random noise"
          - "Ensemble disagreement incorrectly downweights important phase transition samples"
          - "Phase transitions are 'uncertain' but also highly informative for learning task structure"
        recommendations:
          - "R1: Use ensemble disagreement only for tasks with genuine noise/uncertainty"
          - "R2: For hierarchical tasks, consider phase-aware training instead of noise-aware"
          - "R3: Investigate why oracle noise also fails on hierarchical tasks"
          - "R4: Consider alternative uncertainty estimation methods for structured tasks"
    
    - experiment_id: H1.470.1.1.26
      description: "Test ensemble disagreement on hierarchical multi-step tasks with phase transitions"
