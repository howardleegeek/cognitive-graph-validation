current_round: 193
last_action: "H1.427 - Task Type Transfer Learning. Tested whether Per-Object CG learns task-specific features that don't transfer well. Found that Per-Object CG transfers BEST (avg gap +1076.91%) vs 2-Node CG (+1757.24%) vs Baseline (+4305.08%). Hypothesis REFUTED - Per-Object CG learns more generalizable representations, not task-specific ones."
next_intended_action: "H1.428 - Test hybrid architecture combining Per-Object CG (for perception) with 2-Node CG (for action prediction) to get best of both worlds."

experiments:
  total_rounds: 193
  trajectory:
    - experiment_id: H1.427
      description: "Task Type Transfer Learning - Testing if Per-Object CG overfits to task-specific features"
      result:
        conclusion: "REFUTED"
        task: "transfer_learning"
        results:
          baseline_avg_transfer_gap: 4305.08
          two_node_avg_transfer_gap: 1757.24
          per_object_avg_transfer_gap: 1076.91
          spatial_to_multi_gaps:
            baseline: 105.38
            two_node: 90.34
            per_object: 75.66
          multi_to_spatial_gaps:
            baseline: 8504.77
            two_node: 3424.14
            per_object: 2078.17
        key_insight: "Per-Object CG transfers BEST across task types, contradicting the hypothesis that it overfits. The earlier finding that Per-Object CG performs worse on multi-stage tasks (H1.425) is due to task structure, not overfitting. Object-centric features are generalizable but less useful for sequential manipulation."
        config:
          n_demos: 500
          n_runs: 3
          epochs: 30
          finetune_epochs: 10
          architectures: ["Baseline", "2-Node CG", "Per-Object CG"]
          task_types: ["spatial_relations", "multi_stage"]
    - experiment_id: H1.426
      description: "Per-Object CG with Explicit Relational Edges - Testing if explicit spatial relations improve performance"
      result:
        conclusion: "NOT_SUPPORTED"
        task: "spatial_relations"
        results:
          baseline_mse: 0.160611
          two_node_mse: 0.201314
          per_object_mse: 0.151306
          per_object_rel_mse: 0.185970
          per_object_vs_baseline: "-5.79%"
          two_node_vs_baseline: "+25.34%"
          per_object_rel_vs_per_object: "+22.91%"
          per_object_vs_two_node: "-24.84%"
        key_insight: "Adding explicit relational edges HURTS Per-Object CG performance. Standard Per-Object CG without explicit relations achieves best results (-5.79% vs baseline). 2-Node CG performs worst on this task (+25.34% vs baseline)."
        config:
          n_demos: 1500
          seq_len: 15
          n_objects: 5
          obs_dim: 95
          lang_dim: 32
          action_dim: 7
          hidden_dim: 64
          epochs: 20
          batch_size: 32
    - experiment_id: H1.425
      description: "Per-Object CG on Complex Multi-Step Tasks - Testing if advantage increases with task complexity"
      result:
        conclusion: "NOT_SUPPORTED"
        task: "complex_multistep"
        stages_tested: [2, 3, 4]
        results:
          stage_2:
            baseline_mse: 0.064395
            two_node_mse: 0.060018
            per_object_mse: 0.096079
            per_object_vs_two_node: "+60.08%"
          stage_3:
            baseline_mse: 0.065177
            two_node_mse: 0.066755
            per_object_mse: 0.096584
            per_object_vs_two_node: "+44.68%"
          stage_4:
            baseline_mse: 0.068990
            two_node_mse: 0.067047
            per_object_mse: 0.097116
            per_object_vs_two_node: "+44.85%"
        complexity_trend: "decreasing"
        config:
          n_demos: 1500
          seq_len: 15
          n_objects: 5
          obj_feat_dim: 8
          lang_dim: 32
          action_dim: 7
          hidden_dim: 64
          epochs: 20
          lr: 0.001
          batch_size: 32
          n_stages: 3
          noise_scale: 0.5
        key_insight: "Per-Object CG performs significantly WORSE than 2-Node CG on multi-stage tasks across all complexity levels. The advantage does NOT increase with task complexity. 2-Node abstraction provides better generalization for sequential manipulation."

