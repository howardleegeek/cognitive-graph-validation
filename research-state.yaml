    - experiment_id: H1.462
      description: "Re-test GNN-only CG variant on real robot data"
      result:
        conclusion: "REFUTED: 81.31% improvement does NOT generalize to real robot data. Baseline wins by 1.74%. Attention still harmful (-3.28%)."
        task: "real_robot_gnn_only"
        results:
          baseline_concat:
            val_loss: 0.000303
            n_params: 158408
            improvement_pct: 0.0
          cg_no_attention:
            val_loss: 0.000308
            n_params: 1977224
            improvement_pct: -1.74
            cg_wins: false
          cg_full_attention:
            val_loss: 0.000313
            n_params: 3027848
            improvement_pct: -3.28
            cg_wins: false
        key_insight: "CG advantage is data-dependent. Works on clean synthetic data (81.31%) but fails on real robot data (-1.74%). Baseline is more robust to noise and distribution shift."
    - experiment_id: H1.461
      description: "Simplified CG investigation - GNN-only beats baseline"
      result:
        conclusion: "SUPPORTED: CG without attention achieves 81.31% improvement over baseline on simplified synthetic data."
        task: "simplified_cg_variants"
        results:
          baseline_concat:
            val_loss: 0.062887
            n_params: 78087
            improvement_pct: 0.0
          cg_no_attention:
            val_loss: 0.011754
            n_params: 867847
            improvement_pct: 81.31
            cg_wins: true
        key_insight: "Attention mechanism was causing poor performance. GNN message passing alone provides benefit. CG can beat baseline when attention is removed."