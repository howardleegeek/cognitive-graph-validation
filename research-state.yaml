          best_approach: "ensemble_disagreement"
          best_improvement: 0.96
        key_insights:
          - "Phase-aware training does NOT generalize to mixed/noisy tasks"
          - "Ensemble disagreement provides marginal improvement (+0.96%) on some configs"
