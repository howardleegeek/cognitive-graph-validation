          avg_detected_improvement: 99.05
        key_insights:
          - "Phase-aware training dramatically improves hierarchical task learning (+99.05% to +99.82%)"
          - "Automatic phase detection from velocity changes works nearly as well as oracle labels"
          - "Phase transitions should be modeled, not downweighted as 'uncertainty'"
