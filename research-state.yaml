            "10": {avg_improvement: 92.6, wins: 4, total: 4}
            "15": {avg_improvement: 92.6, wins: 4, total: 4}
            "20": {avg_improvement: 94.1, wins: 4, total: 4}
        key_insight: "Task embeddings achieve +91.5% average improvement across all 16 conditions, winning 100% of comparisons. Improvement increases with horizon length (+86.5% to +94.1%), showing task embeddings help maintain coherent behavior over longer sequences."
