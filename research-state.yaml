        key_insights:
          - "Late fusion dramatically improves crossmodal performance: +62.92% gap for LSTM"
          - "Late fusion maintains temporal performance: 95.76% vs 94.24%"
          - "Cognitive Graph consistently underperforms baseline across all tasks"
          - "Processing modalities independently before fusion is superior to early fusion"
          - "Best architecture: separated encoders → independent temporal processing → late concatenation"
        conclusion_detail: "Late-fusion architecture significantly outperforms early fusion, especially on crossmodal tasks. This provides clear architectural direction: maintain modality separation through temporal processing, fuse only at final stage."
    
    - experiment_id: H1.470.1.1.14
      description: "LSTM dominance ablation study - isolating temporal vs encoding factors"
      result:
        conclusion: "SUPPORTED"
        task: "lstm_ablation"
        configurations_tested: 6
        architectures_tested: ["baseline", "lstm", "lstm_feedforward", "separated_temporal", "unified_temporal", "unified_feedforward"]
        tasks_tested: ["temporal_only", "crossmodal_only", "combined"]
        key_metrics:
          temporal_only:
            baseline_loss: 1.9839
            lstm_improvement: 93.85
            lstm_feedforward_improvement: -11.93
            separated_temporal_improvement: 91.51
            unified_temporal_improvement: 72.09
            unified_feedforward_improvement: -38.38
          crossmodal_only:
            baseline_loss: 2.3974
            lstm_improvement: -481.01
            lstm_feedforward_improvement: -500.67
            separated_temporal_improvement: -407.02
            unified_temporal_improvement: -499.57
            unified_feedforward_improvement: -239.85
          combined:
            baseline_loss: 2.1258
            lstm_improvement: -57.57
            lstm_feedforward_improvement: -68.01
            separated_temporal_improvement: -66.01
            unified_temporal_improvement: -66.33
            unified_feedforward_improvement: -67.66
        key_insights:
          - "Temporal processing is the DOMINANT factor: LSTM (+93.85%) vs LSTM-FeedForward (-11.93%) = 105.79% gap"
          - "Separated+Temporal ≈ LSTM: only 2.34% gap between 1D convolutions and LSTM"
          - "Unified encoding underperforms separated encoding by 19.42% even with same temporal processing"
          - "Baseline wins on crossmodal and combined tasks - no architecture beats simple concatenation"
          - "Unified encoding is consistently the worst approach"
        conclusion_detail: "LSTM's dominance comes from temporal recurrence, not separated encoding. However, separated encoding provides an additional 19.42% advantage over unified encoding when combined with temporal processing. The optimal architecture is: separated encoders → temporal processing → simple fusion (concatenation). This contradicts the CG hypothesis entirely."

