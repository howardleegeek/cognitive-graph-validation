last_action: "H1.424 - Hybrid Cognitive Graph Architecture. Designed and tested adaptive architecture that selects between Per-Object CG (for short horizons) and 2-Node CG (for long horizons) based on sequence length. Tested at seq_len=15 (crossover point). Found -8.82% performance vs baseline, with selection mechanism misaligned (preferred two-node at seq_len=15)."
