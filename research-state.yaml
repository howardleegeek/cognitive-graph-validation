        key_insight: "Per-Object CG performs significantly WORSE than 2-Node CG on multi-stage tasks across all complexity levels. The advantage DECREASES with task complexity (60.08% → 44.68% → 44.85%), contradicting the hypothesis. Simpler 2-Node architecture is more robust for multi-stage manipulation."
