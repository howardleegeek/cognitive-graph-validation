              improvement_pct: +1.5
            - objects: 7
              mlp_mse: 0.1104
              combined_mse: 0.1118
              improvement_pct: -1.3
        key_insight: "Combined architectural modifications (edge-aware + high-dim + residual) achieve +2.6% improvement over MLP on action prediction. High-dim object representations are the key fix (+2.4%). Advantage holds at 2-5 objects but disappears at 7 objects."
