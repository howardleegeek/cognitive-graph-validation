hypotheses:
  - id: H1
    name: "Unified cognitive graph achieves higher sample efficiency"
    status: SUPPORTED
    key_finding: "+25.6% improvement with real robot data on short sequences (seq_len 1-20)"
  - id: H1.1
    name: "Hierarchical memory maintains CG advantage at seq_len >= 30"
    status: SUPPORTED
    key_finding: "HM/CG underfit ratios 1.78x (seq30) and 1.47x (seq50), both >1.0x threshold"
  - id: H1.2
    name: "Structural Prior Memory closes HM->CG gap to <1.15x"
    status: PARTIALLY_REFUTED
    key_finding: "SPM/CG ratio 1.21x at seq30 (FAIL), 1.12x at seq50 (PASS). Closes ~50% of HM->CG gap at seq50."
  - id: H1.2.1
    name: "Length-conditioned structural prior strength fixes seq30 SPM failure"
    status: SUPPORTED
    key_finding: "LC-SPM with beta>=0.20 achieves ratio <1.15x at both seq30 (1.14x) and seq50 (1.12x). Minimal beta=0.20, optimal beta=1.00."
  - id: H2
    name: "Attention complexity hypothesis"
    status: INCONCLUSIVE
    key_finding: "1.7% difference, not statistically significant"
  - id: H3
    name: "Concatenation vs attention for simple tasks"
    status: REFUTED
    key_finding: "Concatenation wins over attention for simple tasks"
  - id: H4
    name: "Optimal architecture ratio"
    status: CLOSE
    key_finding: "25% optimal vs 28% hypothesis"

current_round: 293
last_action: "H1.2.1 - Tested Length-Conditioned Structural Prior Memory (LC-SPM). Minimal beta=0.20 passes both seq_len (30: 1.14x, 50: 1.12x). H1.2.1 SUPPORTED."
next_intended_action: "H1.2.2 - Test graph-aware gating mechanism vs LC-SPM at seq_len=30,35,40,45,50. Compare gating-SPM/CG ratios against LC-SPM baseline."

experiments:
  total_rounds: 292
  trajectory:
    - experiment_id: H1.470.1.1.48
      description: "Longer sequence scaling test (seq_len=30, 50)"
      result:
        conclusion: "PARTIALLY REFUTED"
        task: "test_longer_sequences"
        configurations_tested: 2
        key_metrics:
          seq_len_30_cg_underfit: 8.9
          seq_len_30_gru_underfit: 16.5
          seq_len_30_ratio: 1.9
