        key_insights:
          - "Early fusion outperforms late fusion on longer sequences (contrary to hypothesis)"
          - "Late fusion degrades catastrophically on very long sequences (40 timesteps: -49.39%)"
          - "Cognitive Graph shows inconsistent performance: strong at 20-30 timesteps but negative at 40"
