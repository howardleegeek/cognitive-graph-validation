hypotheses:
  - id: H1
    status: SUPPORTED
    description: "Cognitive Graph achieves higher sample efficiency than separated architectures"
    key_evidence: "H1.409: +76.96% improvement on relational LIBERO data; H1.408: +43.05% on relational synthetic data"
    confidence: 0.95
  - id: H1.1
    status: SUPPORTED
    description: "CG benefits require data with explicit relational structure"
    key_evidence: "H1.408: CG wins on relational data (+43%), loses on unstructured (-37%) and overly complex (-32%)"
    confidence: 0.90
  - id: H1.2
    status: SUPPORTED
    description: "GNN provides additional benefit when data has rich relational structure"
    key_evidence: "H1.409: CG with GNN (+76.96%) outperforms CG without GNN (+74.90%) on LIBERO relational data"
    confidence: 0.75
  - id: H2
    status: INCONCLUSIVE
