          seq_len_30_hm_underfit: 12.8
          seq_len_30_ratio_underfit: 1.78
          seq_len_30_cg_loss: 0.42
          seq_len_30_hm_loss: 0.55
          seq_len_30_ratio_loss: 1.31
          seq_len_50_cg_underfit: 8.1
          seq_len_50_hm_underfit: 11.9
          seq_len_50_ratio_underfit: 1.46
          seq_len_50_cg_loss: 0.44
