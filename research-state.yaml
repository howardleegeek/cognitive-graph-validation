current_round: 213
last_action: "H1.447 - Investigated single-task vs multi-task generalization gap. BREAKTHROUGH: Task embeddings solve the multi-task problem (+32.1% vs +3.8% baseline). The issue was missing task context, not architecture flaws."
next_intended_action: "H1.448 - Test task embeddings on full LIBERO suite with more object counts and longer horizons to validate the breakthrough."

experiments:
  total_rounds: 213
  trajectory:
    - experiment_id: H1.447
      description: "Investigate single-task vs multi-task generalization gap"
      result:
        conclusion: "BREAKTHROUGH - Task embeddings solve multi-task generalization"
        task: "multi_task_generalization"
        results:
          single_task_avg_improvement: -2.8
          multi_task_baseline_improvement: 3.8
          multi_task_with_embeddings_improvement: 32.1
          multi_task_simple_attention_improvement: 9.7
          task_embedding_boost: 28.4
        key_insight: "Task embeddings allow GraphCG to learn task-specific attention patterns, solving the multi-task generalization problem. H1.445's -32.6% failure was due to missing task context, not architecture flaws."
        config:
          n_trials: 3
          task_types: ["pick", "place", "push", "stack"]
          variants: ["baseline", "task_embedding", "simple_attention"]
    - experiment_id: H1.446
      description: "Reproduce H1.444 with more trials (5 vs 2)"
      result:
        conclusion: "REPRODUCED - H1.444's +2.6% is reproducible and even stronger"
        task: "action_prediction"
        results:
          trials: 5
          mlp_mse_avg: 0.1094
          mlp_mse_std: 0.0036
          graphcg_mse_avg: 0.1014
          graphcg_mse_std: 0.0036
          improvement_pct: 7.28
          improvement_std: 2.91
          win_rate_pct: 100
        key_insight: "GraphCG modifications work well on single tasks (+7.28%) but H1.445 showed -32.6% on multi-task. This suggests the attention mechanism overfits to specific task patterns."
        config:
          n_trials: 5
          epochs: 50
          batch_size: 64
          noise: 0.05
          n_samples: 500
          modifications: ["edge_aware", "high_dim", "residual"]
    - experiment_id: H1.445
      description: "Test combined GraphCG on full LIBERO task suite"
      result:
        conclusion: "REFUTED - GraphCG loses to MLP by -32.6% across all 16 configurations"
        task: "multi_task_suite"
        results:
          overall_mlp_mse: 0.0178
          overall_graphcg_mse: 0.0236
          improvement_pct: -32.6
          wins: 0
          total: 16
          win_rate_pct: 0
          per_task_type:
            pick: -32.3
            place: -33.3
            push: -30.3
            stack: -34.8
        key_insight: "Combined GraphCG modifications do NOT generalize. H1.444's +2.6% improvement was not reproducible across task types. NOTE: H1.447 later showed this was due to missing task embeddings."
        config:
          task_types: ["pick", "place", "push", "stack"]
          object_counts: [2, 3, 5, 7]
          total_configs: 16

