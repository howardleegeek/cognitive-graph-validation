        sub_hypothesis: "H1.470.1.1.11: Test LSTM architectural improvements (peephole connections, attention-augmented LSTM) to further optimize performance."
    - experiment_id: H1.470.1.1.9
      description: "Hierarchical temporal memory for very long sequences"
      result:
        conclusion: "PARTIALLY_SUPPORTED"
        task: "hierarchical_temporal_memory_very_long"
        configurations_tested: 15
        sequence_lengths: [60, 80, 100, 120, 150]
        architectures_tested: ["baseline", "single_lstm", "hierarchical_2", "hierarchical_3"]
        key_metrics:
          single_lstm_avg_improvement: 73.53
          hierarchical_2_avg_improvement: 76.45
          hierarchical_3_avg_improvement: 77.63
          hier2_vs_single_at_60: 19.62
          hier2_vs_single_at_150: 6.60
          hier3_vs_single_at_60: 21.24
          hier3_vs_single_at_150: 11.38
          correlation_seq_len_vs_hier3_improvement: -0.984
          best_architecture: "hierarchical_3"
        key_insight: "Hierarchical memory provides consistent improvement over single LSTM (77.63% vs 73.53%), but the advantage DECREASES with sequence length (negative correlation -0.984). All models show decreasing performance as sequence length increases from 60 to 150 timesteps."
        sub_hypothesis: "H1.470.1.1.10: Alternative memory architectures (Transformer-XL, state space models) may better handle very long sequences."
    - experiment_id: H1.470.1.1.8
      description: "Hierarchical temporal memory for longer sequences"
      result:
        conclusion: "PARTIALLY_SUPPORTED"
        task: "hierarchical_temporal_memory"
        configurations_tested: 12
        sequence_lengths: [20, 30, 40, 50]
        architectures_tested: ["baseline", "single_lstm", "hierarchical_2", "hierarchical_3"]
        key_metrics:
          single_lstm_avg_improvement: 97.12
          hierarchical_2_avg_improvement: 97.04
          hierarchical_3_avg_improvement: 97.22
          hier2_vs_single_at_20: 1.51
          hier2_vs_single_at_50: -9.69
          hier3_vs_single_at_20: 2.15
          hier3_vs_single_at_30: 8.02
          hier3_vs_single_at_50: 1.06
          best_architecture: "hierarchical_3"
        key_insight: "Hierarchical memory provides marginal benefit over single LSTM. The key finding is that ANY temporal memory provides ~97% improvement over baseline. Hierarchical advantage does not consistently scale with sequence length."
        sub_hypothesis: "H1.470.1.1.9: Test if hierarchical memory benefit emerges with even longer sequences (100+ timesteps)."
    - experiment_id: H1.470.1.1.7
      description: "Temporal memory for strong temporal tasks"
      result:
        conclusion: "SUPPORTED"
        task: "temporal_memory_strong"
        configurations_tested: 6
        sequence_lengths: [10, 20]
        architectures_tested: ["baseline", "attention_only", "lstm_memory", "gru_memory"]
        key_metrics:
          attention_only_improvement: -0.02
          lstm_memory_improvement: 80.44
          gru_memory_improvement: 79.20
          lstm_vs_attention: 80.46
          best_architecture: "lstm_memory"
        key_insight: "Explicit temporal memory (LSTM/GRU) is essential for strong temporal tasks. Attention-only provides no benefit. LSTM slightly outperforms GRU."
        sub_hypothesis: "H1.470.1.1.8: Test if hierarchical temporal memory provides additional benefit over single LSTM."

