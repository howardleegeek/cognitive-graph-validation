        key_insight: "CG advantage collapses at even 1% noise. Baseline is robust across all noise levels. This explains why H1.462 failed on real robot data - real data has inherent noise."
    - experiment_id: H1.462
      description: "Test GNN-only CG on real robot data"
      result:
        conclusion: "REFUTED: 81% improvement from H1.461 does NOT generalize to real robot data. Baseline wins by 1.74%."
        task: "real_robot_validation"
        results:
          baseline_concat:
            params: 158408
            val_loss: 0.000303
            improvement_pct: 0.0
          cg_no_attention:
            params: 1977224
            val_loss: 0.000308
