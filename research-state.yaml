        key_insights:
          - "Underfit ratio advantage COLLAPSES at seq_len >= 30 (1.0-1.9x vs 5.2-13.9x)"
          - "Loss ratio remains consistent at 1.35-1.39x across all sequence lengths"
          - "At long sequences, both models have similar underfit rates but CG has better average predictions"
          - "Correlation between seq_len and ratio is now r=-0.62 (moderate negative)"
          - "H1 is SUPPORTED for seq_len 1-20 but REFUTED for seq_len >= 30 (underfit metric)"
        recommendations:
          - "R1: H1 PARTIALLY REFUTED for long-horizon tasks"
          - "R2: Structural prior helps with average prediction quality at all sequence lengths"
          - "R3: For long-horizon tasks, additional mechanisms (hierarchical planning, memory) are needed"
          - "R4: Generate H1.470.1.1.49 to test hierarchical memory integration"
