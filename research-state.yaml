current_round: 231
last_action: "H1.465 - Tested architectural changes for noise robustness (skip connections, batch norm, dropout, pre-norm). SUPPORTED: Dropout CG achieves 38.16% improvement at 1% noise - 5.5x better than noise augmentation alone."
next_intended_action: "H1.466 - Test dropout CG on real robot data to validate that architectural robustness generalizes to realistic deployment conditions."

experiments:
  total_rounds: 231
  trajectory:
    - experiment_id: H1.465
      description: "Test architectural changes for noise robustness"
      result:
        conclusion: "SUPPORTED: Dropout (30%) achieves 38.16% improvement at 1% noise. All CG variants beat baseline. Architecture beats augmentation by 5.5x."
        task: "noise_robust_architecture"
        results:
          baseline:
            loss: 0.017424
            params: 61447
          cg_standard:
            avg_improvement_pct: 21.68
            loss: 0.013647
            cg_wins: true
          cg_skip:
            avg_improvement_pct: 26.10
            loss: 0.012876
            cg_wins: true
          cg_bn:
            avg_improvement_pct: 27.63
            loss: 0.012609
            cg_wins: true
          cg_skip_bn:
            avg_improvement_pct: 19.21
            loss: 0.014077
            cg_wins: true
          cg_dropout:
            avg_improvement_pct: 38.16
            loss: 0.010774
            cg_wins: true
            best: true
          cg_prenorm:
            avg_improvement_pct: 19.66
            loss: 0.013999
            cg_wins: true
        key_insight: "Dropout is the most effective architectural modification for noise robustness. Skip connections and batch norm also help but should not be combined. CG's noise sensitivity is NOT fundamental - can be addressed through proper regularization."
    - experiment_id: H1.464
      description: "Test noise-robust training techniques"
      result:
        conclusion: "PARTIALLY SUPPORTED: Only heavy noise augmentation (50%) restores CG advantage (6.94% improvement, 76% win rate). Other methods fail."
        task: "noise_robust_training_simulation"
        results:
          standard:
            avg_improvement_pct: -44.33
            win_rate_pct: 1.0
            cg_wins: false
          augmented_0.1:
            avg_improvement_pct: -14.29
            win_rate_pct: 21.0
            cg_wins: false
          augmented_0.2:
            avg_improvement_pct: -3.91
            win_rate_pct: 41.0
            cg_wins: false
          augmented_0.5:
            avg_improvement_pct: 6.94
            win_rate_pct: 76.0
            cg_wins: true
          regularized:
            avg_improvement_pct: -14.36
            win_rate_pct: 19.0
            cg_wins: false
          augmented_regularized:
            avg_improvement_pct: -13.54
            win_rate_pct: 21.0
            cg_wins: false
        key_insight: "CG requires heavy noise augmentation (50%) to overcome noise sensitivity. Light augmentation and regularization alone are insufficient. This suggests CG's graph structure is fundamentally fragile to noise."
    - experiment_id: H1.463
      description: "Investigate generalization gap - noise sensitivity test"
      result:
        conclusion: "CONFIRMED: CG advantage is highly noise-sensitive. Even 1% noise destroys advantage. Real robot data (with noise) explains H1.462 collapse."
        task: "noise_sensitivity_investigation"
        results:
          noise_0.00:
            baseline_loss: 0.002379
            cg_loss: 0.001703
            improvement_pct: 28.42
            cg_wins: true
          noise_0.01:
            baseline_loss: 0.000328
            cg_loss: 0.003177
            improvement_pct: -867.66
            cg_wins: false
          noise_0.05:
            baseline_loss: 0.001356
            cg_loss: 0.003593
            improvement_pct: -164.91
            cg_wins: false
          noise_0.10:
            baseline_loss: 0.001467
            cg_loss: 0.003289
            improvement_pct: -124.20
            cg_wins: false
          noise_0.20:
            baseline_loss: 0.001067
            cg_loss: 0.003274
            improvement_pct: -206.99
            cg_wins: false
          noise_0.30:
            baseline_loss: 0.002000
            cg_loss: 0.003734
            improvement_pct: -86.71
            cg_wins: false
          noise_0.50:
            baseline_loss: 0.000813
            cg_loss: 0.002294
